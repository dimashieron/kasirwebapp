<script>
// ============================================================
// KASIR WARUNG - Frontend JavaScript
// ============================================================

// ============================================================
// STATE
// ============================================================
const State = {
  token: null,
  user: null,
  currentPage: 'dashboard',
  cart: [],
  menuList: [],
  kategoriList: [],
  darkMode: false
};

// ============================================================
// UTILITIES
// ============================================================
const fmt = {
  currency: n => 'Rp ' + parseInt(n||0).toLocaleString('id-ID'),
  date: d => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', {day:'2-digit',month:'2-digit',year:'numeric'});
  },
  dateTime: d => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
           dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  },
  number: n => parseInt(n||0).toLocaleString('id-ID')
};

function togglePass(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

// ============================================================
// API CALL
// ============================================================
function api(action, params = {}) {
  if (State.token) params.token = State.token;
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => resolve(r))
      .withFailureHandler(e => reject(e))
      .serverCall(action, params);
  });
}

// ============================================================
// TOAST
// ============================================================
const Toast = {
  show(msg, type = 'info', duration = 3500) {
    const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
    const wrap = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${msg}</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
    wrap.appendChild(el);
    setTimeout(() => { el.classList.add('hiding'); setTimeout(() => el.remove(), 250); }, duration);
  },
  success: (m) => Toast.show(m,'success'),
  error:   (m) => Toast.show(m,'error'),
  warning: (m) => Toast.show(m,'warning'),
  info:    (m) => Toast.show(m,'info')
};

// ============================================================
// CONFIRM DIALOG
// ============================================================
const Confirm = {
  _resolve: null,
  show(msg, title = 'Konfirmasi', icon = '⚠️', okText = 'Ya, Hapus', okClass = 'btn-danger') {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-icon').textContent = icon;
    document.getElementById('confirm-ok-btn').textContent = okText;
    document.getElementById('confirm-ok-btn').className = `btn ${okClass}`;
    document.getElementById('confirm-overlay').classList.remove('hidden');
    return new Promise(res => { this._resolve = res; });
  },
  ok() { document.getElementById('confirm-overlay').classList.add('hidden'); this._resolve && this._resolve(true); },
  cancel() { document.getElementById('confirm-overlay').classList.add('hidden'); this._resolve && this._resolve(false); }
};

// ============================================================
// MODAL
// ============================================================
const Modal = {
  show(title, bodyHtml, footerHtml = '') {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-footer').innerHTML = footerHtml;
    document.getElementById('modal-overlay').classList.remove('hidden');
  },
  close() { document.getElementById('modal-overlay').classList.add('hidden'); },
  closeOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) this.close(); }
};

// ============================================================
// APP CORE
// ============================================================
const App = {
  async init() {
    // Dark mode
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark');
      State.darkMode = true;
    }
    // Check session
    const savedToken = localStorage.getItem('kw_token');
    const savedUser = localStorage.getItem('kw_user');
    if (savedToken && savedUser) {
      State.token = savedToken;
      State.user = JSON.parse(savedUser);
      try {
        const r = await api('checkSession', { token: savedToken });
        if (r.success) {
          this.showApp();
          return;
        }
      } catch(e) {}
    }
    this.showLogin();
  },

  showLogin() {
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('login-page').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  },

  showApp() {
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('topbar-user').textContent = State.user.nama;
    document.getElementById('sidebar-user-info').textContent = `${State.user.nama} • ${State.user.role}`;
    this.applyRoleAccess();
    this.navigate(State.currentPage);
  },

  applyRoleAccess() {
    if (State.user.role !== 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
    }
  },

  async login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { Toast.error('Username dan password wajib diisi'); return; }
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div>';
    try {
      const r = await api('login', { username, password });
      if (r.success) {
        State.token = r.data.token;
        State.user = r.data.user;
        localStorage.setItem('kw_token', State.token);
        localStorage.setItem('kw_user', JSON.stringify(State.user));
        Toast.success('Selamat datang, ' + State.user.nama + '!');
        this.showApp();
      } else {
        Toast.error(r.message);
      }
    } catch(e) { Toast.error('Gagal terhubung ke server'); }
    btn.disabled = false; btn.innerHTML = '<span>Masuk</span>';
  },

  async logout() {
    const ok = await Confirm.show('Yakin ingin keluar?', 'Logout', '🚪', 'Ya, Keluar', 'btn-primary');
    if (!ok) return;
    try { await api('logout'); } catch(e) {}
    State.token = null; State.user = null; State.cart = [];
    localStorage.removeItem('kw_token'); localStorage.removeItem('kw_user');
    this.showLogin();
  },

  navigate(page) {
    document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const pageEl = document.getElementById('page-' + page);
    if (!pageEl) return;
    pageEl.classList.remove('hidden');
    const navEl = document.querySelector(`[data-page="${page}"]`);
    if (navEl) navEl.classList.add('active');
    document.getElementById('topbar-title').textContent = navEl ? navEl.querySelector('span:last-child').textContent : page;
    State.currentPage = page;
    this.closeSidebar();
    Pages[page] && Pages[page].load();
  },

  toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('active');
  },
  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
  },
  toggleDark() {
    State.darkMode = !State.darkMode;
    document.body.classList.toggle('dark', State.darkMode);
    localStorage.setItem('darkMode', State.darkMode);
  }
};

// ============================================================
// PAGES
// ============================================================
const Pages = {};

// ---- DASHBOARD ----
Pages.dashboard = {
  async load() {
    const el = document.getElementById('page-dashboard');
    el.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><p>Memuat dashboard...</p></div>`;
    try {
      const r = await api('getDashboardData');
      if (!r.success) { el.innerHTML = `<div class="empty-state"><div class="icon">😕</div><p>${r.message}</p></div>`; return; }
      const d = r.data;
      el.innerHTML = `
      <div class="page-header">
        <div><div class="page-title">📊 Dashboard</div><div class="page-subtitle">Ringkasan hari ini</div></div>
        <button class="btn btn-outline btn-sm" onclick="Pages.dashboard.load()">🔄 Refresh</button>
      </div>

      <div class="grid-4" style="margin-bottom:1.25rem">
        ${this.statCard('💰','Total Penjualan',fmt.currency(d.totalPenjualan),'Hari ini')}
        ${this.statCard('🧾','Transaksi',d.jumlahTransaksi,'Hari ini')}
        ${this.statCard('💸','Pengeluaran',fmt.currency(d.totalPengeluaran),'Hari ini')}
        ${this.statCard('📈','Laba Bersih',fmt.currency(d.labaBersih),'Estimasi hari ini')}
      </div>

      <div class="grid-2" style="margin-bottom:1.25rem">
        <div class="card">
          <div class="card-header"><span class="card-title">📊 Penjualan 7 Hari</span></div>
          <div class="card-body">${this.renderChart(d.grafik)}</div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">🔥 Produk Terlaris</span></div>
          <div class="card-body">
            ${d.produkTerlaris.length ? d.produkTerlaris.map((p,i) => `
              <div class="flex items-center justify-between" style="padding:.4rem 0;border-bottom:1px solid var(--border)">
                <span><strong style="color:var(--primary)">#${i+1}</strong> ${p.nama}</span>
                <span class="badge badge-pink">${p.total} terjual</span>
              </div>`).join('') : '<div class="empty-state" style="padding:1rem"><p>Belum ada data</p></div>'}
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header"><span class="card-title">⚠️ Stok Menu Hampir Habis</span></div>
          <div class="card-body">
            ${d.stokHampirHabis.length ? d.stokHampirHabis.map(m => `
              <div class="flex items-center justify-between" style="padding:.4rem 0;border-bottom:1px solid var(--border)">
                <span>${m.nama}</span>
                <span class="badge badge-red">${m.stok} ${m.satuan}</span>
              </div>`).join('') : '<div class="empty-state" style="padding:1rem"><p>✅ Stok aman</p></div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">🚨 Bahan Baku Kritis</span></div>
          <div class="card-body">
            ${d.bahanKritis.length ? d.bahanKritis.map(b => `
              <div class="flex items-center justify-between" style="padding:.4rem 0;border-bottom:1px solid var(--border)">
                <span>${b.nama}</span>
                <span class="badge badge-yellow">${b.stok}/${b.minimum} ${b.satuan}</span>
              </div>`).join('') : '<div class="empty-state" style="padding:1rem"><p>✅ Bahan aman</p></div>'}
          </div>
        </div>
      </div>`;
    } catch(e) { el.innerHTML = `<div class="empty-state"><div class="icon">😕</div><p>Gagal memuat: ${e.message||e}</p></div>`; }
  },
  statCard(icon, label, value, sub) {
    return `<div class="stat-card"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`;
  },
  renderChart(data) {
    if (!data || !data.length) return '<p class="text-muted text-center">Tidak ada data</p>';
    const max = Math.max(...data.map(d => d.total), 1);
    return `<div class="chart-bars">
      ${data.map(d => {
        const h = Math.max(4, Math.round((d.total / max) * 140));
        return `<div class="chart-bar-col">
          <div class="chart-bar" style="height:${h}px" title="${fmt.currency(d.total)}"></div>
          <div class="chart-bar-label">${d.label}</div>
        </div>`;
      }).join('')}
    </div>`;
  }
};

// ---- KASIR ----
Pages.kasir = {
  selectedKat: 'all',
  metode: 'Tunai',
  diskon: 0,

  async load() {
    const el = document.getElementById('page-kasir');
    el.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;
    try {
      const [mR, kR] = await Promise.all([api('getMenu',{aktif:true}), api('getKategori')]);
      State.menuList = mR.data || [];
      State.kategoriList = kR.data || [];
      this.render();
    } catch(e) { el.innerHTML = `<div class="empty-state"><p>Gagal memuat: ${e}</p></div>`; }
  },

  render() {
    const el = document.getElementById('page-kasir');
    el.innerHTML = `
    <div class="page-header">
      <div class="page-title">🛒 Kasir</div>
      <button class="btn btn-outline btn-sm" onclick="Pages.kasir.clearCart()">🗑️ Kosongkan</button>
    </div>
    <div class="kasir-layout">
      <!-- MENU PANEL -->
      <div class="kasir-menu-panel">
        <div class="search-bar" style="margin-bottom:.75rem">
          <span>🔍</span>
          <input type="text" placeholder="Cari menu..." id="kasir-search" oninput="Pages.kasir.filterMenu()">
        </div>
        <div class="kat-tabs" id="kat-tabs" style="margin-bottom:.75rem">
          <button class="kat-tab active" data-kat="all" onclick="Pages.kasir.filterKat('all',this)">Semua</button>
          ${State.kategoriList.map(k => `<button class="kat-tab" data-kat="${k.id}" onclick="Pages.kasir.filterKat('${k.id}',this)">${k.nama}</button>`).join('')}
        </div>
        <div class="menu-grid" id="menu-grid">${this.renderMenuGrid(State.menuList)}</div>
      </div>
      <!-- CART PANEL -->
      <div class="card kasir-cart-panel" style="display:flex;flex-direction:column;">
        <div class="card-header"><span class="card-title">🧺 Keranjang</span><span class="badge badge-pink" id="cart-count">0 item</span></div>
        <div class="kasir-cart-inner" id="cart-items">
          <div class="empty-cart"><div class="icon">🛒</div><p>Keranjang kosong</p><p class="text-sm">Pilih menu di sebelah kiri</p></div>
        </div>
        <div class="kasir-sticky-footer">
          <div id="cart-summary"></div>
          <div style="margin:.75rem 0">
            <label class="text-sm font-semibold">Diskon (Rp)</label>
            <input type="number" id="diskon-input" value="0" min="0" style="width:100%;padding:.5rem .75rem;border:2px solid var(--border);border-radius:8px;margin-top:.3rem;background:var(--bg);color:var(--text);outline:none"
              oninput="Pages.kasir.updateSummary()">
          </div>
          <div style="margin-bottom:.75rem">
            <label class="text-sm font-semibold" style="margin-bottom:.4rem;display:block">Metode Pembayaran</label>
            <div class="metode-tabs">
              <button class="metode-tab active" onclick="Pages.kasir.setMetode('Tunai',this)">💵 Tunai</button>
              <button class="metode-tab" onclick="Pages.kasir.setMetode('QRIS',this)">📱 QRIS</button>
              <button class="metode-tab" onclick="Pages.kasir.setMetode('Transfer',this)">🏦 Transfer</button>
            </div>
          </div>
          <div style="margin-bottom:.75rem">
            <input type="text" id="catatan-input" placeholder="Catatan (opsional)..."
              style="width:100%;padding:.5rem .75rem;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none">
          </div>
          <button class="btn btn-primary btn-full btn-lg" id="bayar-btn" onclick="Pages.kasir.bayar()" disabled>💳 Bayar</button>
        </div>
      </div>
    </div>`;
    this.updateCartUI();
  },

  renderMenuGrid(items) {
    if (!items.length) return `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🍽️</div><p>Menu tidak ditemukan</p></div>`;
    return items.map(m => `
      <div class="menu-card ${m.stok <= 0 ? 'out-of-stock' : ''}" onclick="Pages.kasir.addToCart('${m.id}')">
        <div class="menu-card-img">${m.foto ? `<img src="${m.foto}" alt="${m.nama}" style="width:100%;height:100%;object-fit:cover">` : '🍽️'}</div>
        <div class="menu-card-body">
          <div class="menu-card-name">${m.nama}</div>
          <div class="menu-card-price">${fmt.currency(m.hargaJual)}</div>
          <div class="menu-card-stok">${m.stok <= 0 ? '❌ Habis' : `Stok: ${m.stok} ${m.satuan}`}</div>
        </div>
      </div>`).join('');
  },

  filterKat(kat, btn) {
    this.selectedKat = kat;
    document.querySelectorAll('.kat-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    this.filterMenu();
  },

  filterMenu() {
    const q = (document.getElementById('kasir-search')?.value || '').toLowerCase();
    let items = State.menuList;
    if (this.selectedKat !== 'all') items = items.filter(m => m.idKategori === this.selectedKat);
    if (q) items = items.filter(m => m.nama.toLowerCase().includes(q));
    const grid = document.getElementById('menu-grid');
    if (grid) grid.innerHTML = this.renderMenuGrid(items);
  },

  addToCart(id) {
    const menu = State.menuList.find(m => m.id === id);
    if (!menu) return;
    const existing = State.cart.find(c => c.id === id);
    if (existing) {
      if (existing.jumlah >= menu.stok) { Toast.warning('Stok tidak cukup'); return; }
      existing.jumlah++;
    } else {
      State.cart.push({ id: menu.id, nama: menu.nama, harga: menu.hargaJual, jumlah: 1, stok: menu.stok });
    }
    this.updateCartUI();
    Toast.success(`${menu.nama} ditambahkan`);
  },

  changeQty(id, delta) {
    const item = State.cart.find(c => c.id === id);
    if (!item) return;
    item.jumlah += delta;
    if (item.jumlah <= 0) { this.removeItem(id); return; }
    if (item.jumlah > item.stok) { item.jumlah = item.stok; Toast.warning('Stok tidak cukup'); }
    this.updateCartUI();
  },

  removeItem(id) {
    State.cart = State.cart.filter(c => c.id !== id);
    this.updateCartUI();
  },

  clearCart() {
    if (State.cart.length === 0) return;
    State.cart = [];
    this.updateCartUI();
  },

  setMetode(m, btn) {
    this.metode = m;
    document.querySelectorAll('.metode-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
  },

  updateCartUI() {
    const countEl = document.getElementById('cart-count');
    const itemsEl = document.getElementById('cart-items');
    const bayarBtn = document.getElementById('bayar-btn');
    if (!itemsEl) return;

    const total = State.cart.reduce((s, c) => s + c.jumlah, 0);
    if (countEl) countEl.textContent = `${total} item`;
    if (bayarBtn) bayarBtn.disabled = State.cart.length === 0;

    if (State.cart.length === 0) {
      itemsEl.innerHTML = `<div class="empty-cart"><div class="icon">🛒</div><p>Keranjang kosong</p><p class="text-sm">Pilih menu di sebelah kiri</p></div>`;
    } else {
      itemsEl.innerHTML = State.cart.map(c => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name truncate">${c.nama}</div>
            <div class="cart-item-price">${fmt.currency(c.harga)} × ${c.jumlah} = ${fmt.currency(c.harga * c.jumlah)}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="Pages.kasir.changeQty('${c.id}',-1)">−</button>
            <span class="qty-num">${c.jumlah}</span>
            <button class="qty-btn" onclick="Pages.kasir.changeQty('${c.id}',1)">+</button>
          </div>
          <button class="cart-delete" onclick="Pages.kasir.removeItem('${c.id}')">🗑️</button>
        </div>`).join('');
    }
    this.updateSummary();
  },

  updateSummary() {
    const el = document.getElementById('cart-summary');
    if (!el) return;
    const subtotal = State.cart.reduce((s, c) => s + c.harga * c.jumlah, 0);
    this.diskon = parseFloat(document.getElementById('diskon-input')?.value || 0) || 0;
    const total = Math.max(0, subtotal - this.diskon);
    el.innerHTML = `
      <div class="cart-total-row"><span>Subtotal</span><span>${fmt.currency(subtotal)}</span></div>
      ${this.diskon > 0 ? `<div class="cart-total-row"><span>Diskon</span><span style="color:var(--success)">-${fmt.currency(this.diskon)}</span></div>` : ''}
      <div class="cart-total-row total"><span>TOTAL</span><span>${fmt.currency(total)}</span></div>`;
  },

  async bayar() {
    if (State.cart.length === 0) return;
    const subtotal = State.cart.reduce((s, c) => s + c.harga * c.jumlah, 0);
    this.diskon = parseFloat(document.getElementById('diskon-input')?.value || 0) || 0;
    const total = Math.max(0, subtotal - this.diskon);
    const catatan = document.getElementById('catatan-input')?.value || '';
    const btn = document.getElementById('bayar-btn');
    btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Memproses...';
    try {
      const r = await api('saveTransaksi', {
        items: State.cart, diskon: this.diskon,
        metodePembayaran: this.metode, catatan
      });
      if (r.success) {
        Toast.success('Transaksi berhasil!');
        this.showStruk(r.data);
        // Reload stok
        const mR = await api('getMenu',{aktif:true});
        State.menuList = mR.data || [];
        State.cart = [];
        this.updateCartUI();
        this.filterMenu();
      } else {
        Toast.error(r.message);
      }
    } catch(e) { Toast.error('Gagal: ' + e.message); }
    btn.disabled = false; btn.innerHTML = '💳 Bayar';
  },

  showStruk(trx) {
    const subtotal = State.cart.length > 0 
      ? State.cart.reduce((s,c) => s + c.harga*c.jumlah, 0) 
      : (trx.total + (trx.diskon||0));
    Modal.show('🧾 Struk Transaksi', `
      <div class="struk" id="struk-content">
        <div class="struk-title">🛒 KASIR WARUNG</div>
        <div style="text-align:center;font-size:.75rem;color:#666;margin:.3rem 0">No: ${trx.nomorInvoice}</div>
        <div style="text-align:center;font-size:.75rem;color:#666">${fmt.dateTime(trx.tanggal||new Date())}</div>
        <hr class="struk-divider">
        ${(State.cart.length > 0 ? State.cart : []).map(c => `
          <div class="struk-row"><span>${c.nama}</span><span></span></div>
          <div class="struk-row" style="color:#666"><span>  ${c.jumlah}x ${fmt.currency(c.harga)}</span><span>${fmt.currency(c.harga*c.jumlah)}</span></div>`).join('')}
        <hr class="struk-divider">
        <div class="struk-row"><span>Subtotal</span><span>${fmt.currency(subtotal)}</span></div>
        ${this.diskon > 0 ? `<div class="struk-row"><span>Diskon</span><span>-${fmt.currency(this.diskon)}</span></div>` : ''}

    try {
      const r = await api('getTransaksi', {
        tanggalMulai: fromEl?.value, tanggalSelesai: toEl?.value,

      });

      this.total = r.data.total;

      const wrap = document.getElementById('trx-table-wrap');
      if (!wrap) return;
      if (!rows.length) {
        wrap.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>Tidak ada transaksi</h3></div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Invoice</th><th>Tanggal</th><th>Kasir</th><th>Total</th><th>Metode</th><th>Aksi</th>
            </tr></thead>
            <tbody>
              ${rows.map(t => `<tr>
                <td><span class="chip">${t.nomorInvoice}</span></td>
                <td>${fmt.dateTime(t.tanggal)}</td>
                <td>${t.namaKasir}</td>
                <td><strong>${fmt.currency(t.total)}</strong></td>
                <td><span class="badge ${t.metodePembayaran==='Tunai'?'badge-green':t.metodePembayaran==='QRIS'?'badge-blue':'badge-pink'}">${t.metodePembayaran}</span></td>
                <td class="flex gap-2">
                  <button class="btn btn-outline btn-sm" onclick="Pages.transaksi.detail('${t.id}')">📄 Detail</button>
                  ${State.user.role==='admin'?`<button class="btn btn-sm" style="background:#fee2e2;color:#dc2626" onclick="Pages.transaksi.hapus('${t.id}')">🗑️</button>`:''}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${this.renderPagination()}`;
    } catch(e) { Toast.error('Gagal: ' + e); }
  },
  renderPagination() {
    const totalPages = Math.ceil(this.total / this.limit);
    if (totalPages <= 1) return '';
    let btns = `<div class="pagination">`;
    btns += `<button class="page-btn" onclick="Pages.transaksi.goPage(${this.page-1})" ${this.page<=1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - this.page) <= 2) {
        btns += `<button class="page-btn ${i===this.page?'active':''}" onclick="Pages.transaksi.goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - this.page) === 3) { btns += `<span class="page-btn">…</span>`; }
    }
    btns += `<button class="page-btn" onclick="Pages.transaksi.goPage(${this.page+1})" ${this.page>=totalPages?'disabled':''}>›</button>`;
    btns += `</div><div class="text-center text-sm text-muted" style="margin-top:.5rem">Total ${this.total} transaksi</div>`;

        ${t.catatan ? `<div class="flex justify-between text-sm" style="padding:.3rem 0"><span class="text-muted">Catatan</span><span>${t.catatan}</span></div>` : ''}
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <thead><tr style="background:var(--pink-50)">

        </tr></thead>
        <tbody>

        </tbody>

      ${t.diskon > 0 ? `<div class="flex justify-between"><span>Diskon</span><span style="color:var(--success)">-${fmt.currency(t.diskon)}</span></div>` : ''}
      <div class="flex justify-between font-bold" style="font-size:1.1rem;color:var(--primary);margin-top:.5rem"><span>TOTAL</span><span>${fmt.currency(t.total)}</span></div>`,

Pages.laporan = {
  async load() {
    const el = document.getElementById('page-laporan');
    el.innerHTML = `
    <div class="page-header"><div class="page-title">📈 Laporan</div></div>
    <div class="filter-bar">
      <select id="lap-periode" onchange="Pages.laporan.onPeriodeChange()" style="padding:.65rem 1rem;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-weight:600">
        <option value="harian">Harian</option>
        <option value="mingguan">Mingguan</option>
        <option value="bulanan">Bulanan</option>
        <option value="kustom">Kustom</option>
      </select>
      <div id="lap-date-range" class="hidden flex gap-2">
        <input type="date" id="lap-from" style="padding:.6rem;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)">
        <input type="date" id="lap-to" style="padding:.6rem;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)">
      </div>
      <button class="btn btn-primary" onclick="Pages.laporan.generate()">📊 Generate</button>

    <div id="lap-result"></div>`;

  },
  onPeriodeChange() {
    const p = document.getElementById('lap-periode')?.value;
    const dr = document.getElementById('lap-date-range');
    if (dr) dr.classList.toggle('hidden', p !== 'kustom');
  },
  async generate() {
    const el = document.getElementById('lap-result');
    el.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;
    const periode = document.getElementById('lap-periode')?.value || 'harian';
    const params = { periode };
    if (periode === 'kustom') {
      params.tanggalMulai = document.getElementById('lap-from')?.value;
      params.tanggalSelesai = document.getElementById('lap-to')?.value;
    }
    const r = await api('getLaporan', params);
    if (!r.success) { el.innerHTML = `<div class="empty-state"><p>${r.message}</p></div>`; return; }
    const d = r.data;
    this.data = d;
    const labelMap = {harian:'Hari Ini',mingguan:'Minggu Ini',bulanan:'Bulan Ini',kustom:'Periode Kustom'};
    el.innerHTML = `
    <div class="laporan-stat">
      ${this.statCard('💰','Total Penjualan',fmt.currency(d.totalPenjualan),'positive')}
      ${this.statCard('🧾','Jumlah Transaksi',d.totalTransaksi,'')}
      ${this.statCard('🎟️','Total Diskon',fmt.currency(d.totalDiskon),'')}
      ${this.statCard('💸','Total Pengeluaran',fmt.currency(d.totalPengeluaran),'negative')}
      ${this.statCard('🏭','Total Modal',fmt.currency(d.totalModal),'')}
      ${this.statCard('📈','Laba Kotor',fmt.currency(d.labaKotor),d.labaKotor>=0?'positive':'negative')}
      ${this.statCard('✨','Laba Bersih',fmt.currency(d.labaBersih),d.labaBersih>=0?'positive':'negative')}
    </div>

    <div class="grid-2" style="margin-bottom:1.25rem">
      <div class="card">
        <div class="card-header"><span class="card-title">💳 Per Metode Pembayaran</span></div>
        <div class="card-body">
          ${(d.metodeSummary||[]).map(m => `
            <div class="flex justify-between items-center" style="padding:.5rem 0;border-bottom:1px solid var(--border)">
              <span>${m.metode}</span>
              <div class="text-right">
                <div class="font-bold">${fmt.currency(m.total)}</div>
                <div class="text-xs text-muted">${m.jumlah} transaksi</div>
              </div>
            </div>`).join('')||'<p class="text-muted text-center">Tidak ada data</p>'}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📊 Ringkasan Laba Rugi</span></div>
        <div class="card-body">
          <div class="flex justify-between" style="padding:.4rem 0"><span>Penjualan</span><span class="positive">${fmt.currency(d.totalPenjualan)}</span></div>
          <div class="flex justify-between" style="padding:.4rem 0"><span>Modal</span><span style="color:var(--danger)">-${fmt.currency(d.totalModal)}</span></div>
          <div class="flex justify-between" style="padding:.4rem 0"><span>Laba Kotor</span><span>${fmt.currency(d.labaKotor)}</span></div>
          <div class="flex justify-between" style="padding:.4rem 0"><span>Pengeluaran</span><span style="color:var(--danger)">-${fmt.currency(d.totalPengeluaran)}</span></div>
          <hr class="divider">
          <div class="flex justify-between font-bold" style="font-size:1.1rem"><span>Laba Bersih</span><span class="${d.labaBersih>=0?'text-success':'text-danger'}">${fmt.currency(d.labaBersih)}</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">📋 Detail Transaksi</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Invoice</th><th>Tanggal</th><th>Kasir</th><th>Diskon</th><th>Total</th><th>Metode</th></tr></thead>
          <tbody>
            ${d.transaksi.length ? d.transaksi.map(t => `<tr>
              <td><span class="chip">${t.nomorInvoice}</span></td>
              <td>${fmt.dateTime(t.tanggal)}</td>
              <td>${t.namaKasir}</td>
              <td>${t.diskon>0?fmt.currency(t.diskon):'-'}</td>
              <td><strong>${fmt.currency(t.total)}</strong></td>
              <td>${t.metodePembayaran}</td>
            </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted">Tidak ada transaksi</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
  },
  statCard(icon, label, value, cls) {
    return `<div class="laporan-stat-card"><div class="laporan-stat-label">${icon} ${label}</div><div class="laporan-stat-val ${cls}">${value}</div></div>`;
  },
  exportCSV() {
    if (!this.data || !this.data.transaksi) { Toast.warning('Generate laporan dulu'); return; }
    const rows = [['Invoice','Tanggal','Kasir','Subtotal','Diskon','Total','Metode']];
    this.data.transaksi.forEach(t => rows.push([t.nomorInvoice, fmt.dateTime(t.tanggal), t.namaKasir, t.subtotal, t.diskon, t.total, t.metodePembayaran]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `laporan_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    Toast.success('CSV berhasil diunduh');
  }
};
