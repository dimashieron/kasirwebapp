<style>
/* ============================================================
   KASIR WARUNG - CSS (Pink Pastel Theme)
   ============================================================ */

:root {
  --pink-50:  #fdf2f8;
  --pink-100: #fce7f3;
  --pink-200: #fbcfe8;
  --pink-300: #f9a8d4;
  --pink-400: #f472b6;
  --pink-500: #ec4899;
  --pink-600: #db2777;
  --pink-700: #be185d;
  --pink-800: #9d174d;
  --pink-900: #831843;

  --bg:       #fdf2f8;
  --surface:  #ffffff;
  --border:   #fbcfe8;
  --text:     #1f2937;
  --text-2:   #6b7280;
  --text-3:   #9ca3af;
  --primary:  #ec4899;
  --primary-hover: #db2777;
  --danger:   #ef4444;
  --success:  #22c55e;
  --warning:  #f59e0b;
  --info:     #3b82f6;
  --shadow:   0 1px 3px rgba(236,72,153,.10), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(236,72,153,.12);
  --shadow-lg:0 10px 40px rgba(236,72,153,.15);
  --radius:   14px;
  --radius-sm:8px;
  --sidebar-w:260px;
  --topbar-h: 60px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}

/* Dark mode */
body.dark {
  --bg:      #1a0d12;
  --surface: #2d1520;
  --border:  #4a1f30;
  --text:    #f9fafb;
  --text-2:  #d1d5db;
  --text-3:  #9ca3af;
  --shadow:  0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}

/* RESET */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; }
img { max-width: 100%; }

/* UTILITY */
.hidden { display: none !important; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: .5rem; }
.gap-3 { gap: .75rem; }
.gap-4 { gap: 1rem; }
.mt-1 { margin-top: .25rem; }
.mt-2 { margin-top: .5rem; }
.mt-4 { margin-top: 1rem; }
.mb-4 { margin-bottom: 1rem; }
.text-sm { font-size: .875rem; }
.text-xs { font-size: .75rem; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.font-bold { font-weight: 700; }
.font-semibold { font-weight: 600; }
.text-primary { color: var(--primary); }
.text-muted { color: var(--text-2); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }
.w-full { width: 100%; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; }

/* ============================================================
   SPLASH SCREEN
   ============================================================ */
#splash-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--pink-50);
  display: flex; align-items: center; justify-content: center;
}
.splash-content { text-align: center; }
.splash-icon { font-size: 4rem; margin-bottom: 1rem; animation: bounce .8s infinite; }
.splash-title { font-size: 2rem; font-weight: 800; color: var(--pink-600); }
.splash-sub { color: var(--text-2); margin-top: .5rem; }
.splash-loader { display: flex; gap: .5rem; justify-content: center; margin-top: 2rem; }
.splash-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--primary);
  animation: splashBounce .8s ease-in-out infinite;
}
.splash-dot:nth-child(2) { animation-delay: .15s; }
.splash-dot:nth-child(3) { animation-delay: .3s; }
@keyframes splashBounce { 0%,80%,100%{transform:scale(0);opacity:.5} 40%{transform:scale(1);opacity:1} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

/* ============================================================
   LOGIN PAGE
   ============================================================ */
#login-page {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 1rem; position: relative; overflow: hidden;
}
.login-bg { position: fixed; inset: 0; z-index: 0; }
.login-blob {
  position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5;
}
.b1 { width: 400px; height: 400px; background: var(--pink-200); top: -100px; right: -100px; }
.b2 { width: 350px; height: 350px; background: var(--pink-300); bottom: -80px; left: -80px; }
.login-card {
  background: var(--surface); border-radius: 24px; padding: 2.5rem;
  width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);
  position: relative; z-index: 1; animation: slideUp .4s ease;
}
.login-logo { font-size: 3rem; text-align: center; margin-bottom: .5rem; }
.login-title { font-size: 1.75rem; font-weight: 800; text-align: center; color: var(--pink-700); }
.login-sub { text-align: center; color: var(--text-2); margin-bottom: 2rem; }
.login-hint { text-align: center; color: var(--text-3); font-size: .8rem; margin-top: 1rem; }
.input-eye-wrap { position: relative; }
.input-eye-wrap input { padding-right: 3rem; }
.eye-btn {
  position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0;
}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h); z-index: 100;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 1rem; gap: 1rem;
  box-shadow: var(--shadow);
}
.menu-toggle {
  font-size: 1.25rem; width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: var(--transition);
}
.menu-toggle:hover { background: var(--pink-100); color: var(--primary); }
.topbar-brand {
  font-size: 1.1rem; font-weight: 800; color: var(--pink-700); flex: 1;
  display: flex; align-items: center; gap: .5rem;
}
.topbar-right { display: flex; align-items: center; gap: .75rem; }
.topbar-user {
  font-size: .85rem; font-weight: 600; color: var(--primary);
  background: var(--pink-100); padding: .3rem .8rem; border-radius: 20px;
  max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 1.1rem;
  color: var(--text-2); transition: var(--transition);
}
.btn-icon:hover { background: var(--pink-100); color: var(--primary); }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 149; background: rgba(0,0,0,.3);
  backdrop-filter: blur(2px); opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
}
.sidebar-overlay.active { opacity: 1; pointer-events: all; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 150;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transform: translateX(-100%);
  transition: transform var(--transition); overflow-y: auto;
}
.sidebar.open { transform: translateX(0); }
.sidebar-header {
  display: flex; align-items: center; gap: 1rem; padding: 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo { font-size: 2rem; }
.sidebar-app-name { font-weight: 800; font-size: 1.1rem; color: var(--pink-700); }
.sidebar-user-info { font-size: .8rem; color: var(--text-2); margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
.nav-section-label {
  font-size: .7rem; font-weight: 700; color: var(--text-3);
  letter-spacing: .08em; padding: .75rem 1.25rem .35rem; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: .75rem; padding: .75rem 1.25rem;
  border-radius: 12px; margin: 2px .5rem; color: var(--text-2);
  font-weight: 600; font-size: .9rem; transition: var(--transition);
}
.nav-item:hover { background: var(--pink-100); color: var(--primary); }
.nav-item.active { background: var(--pink-100); color: var(--pink-700); }
.nav-item.active .nav-icon { filter: none; }
.nav-icon { font-size: 1.1rem; width: 24px; text-align: center; }
.sidebar-footer { padding: 1rem; border-top: 1px solid var(--border); }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main-content {
  padding-top: var(--topbar-h);
  min-height: 100vh;
  background: var(--bg);
}
.page-section { padding: 1.25rem; }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; flex-wrap: wrap; gap: .75rem;
}
.page-title { font-size: 1.4rem; font-weight: 800; color: var(--text); }
.page-subtitle { font-size: .85rem; color: var(--text-2); margin-top: 2px; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden;
}
.card-body { padding: 1.25rem; }
.card-header {
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-weight: 700; font-size: 1rem; color: var(--text); }
.stat-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 1.25rem; box-shadow: var(--shadow); border: 1px solid var(--border);
  transition: var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stat-icon { font-size: 2rem; margin-bottom: .75rem; }
.stat-label { font-size: .8rem; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.stat-value { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-top: .25rem; }
.stat-sub { font-size: .75rem; color: var(--text-3); margin-top: .25rem; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .65rem 1.25rem; border-radius: 10px; font-weight: 700;
  font-size: .9rem; transition: var(--transition); border: 2px solid transparent;
  white-space: nowrap; cursor: pointer;
}
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-outline { background: transparent; color: var(--primary); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); background: var(--pink-50); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { opacity: .9; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-sm { padding: .4rem .85rem; font-size: .8rem; border-radius: 8px; }
.btn-lg { padding: .85rem 1.75rem; font-size: 1rem; border-radius: 12px; }
.btn-full { width: 100%; }
.btn-icon-sm { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; }

/* ============================================================
   FORMS
   ============================================================ */
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block; font-weight: 600; font-size: .875rem;
  color: var(--text); margin-bottom: .4rem;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%; padding: .7rem 1rem; border: 2px solid var(--border);
  border-radius: 10px; background: var(--bg); color: var(--text);
  transition: var(--transition); outline: none;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--primary); background: var(--surface); }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-hint { font-size: .75rem; color: var(--text-3); margin-top: .3rem; }
.form-error { font-size: .75rem; color: var(--danger); margin-top: .3rem; }

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--pink-50); }
th {
  padding: .75rem 1rem; text-align: left; font-size: .8rem;
  font-weight: 700; color: var(--pink-700); white-space: nowrap;
  text-transform: uppercase; letter-spacing: .05em;
}
td { padding: .75rem 1rem; border-bottom: 1px solid var(--border); font-size: .875rem; color: var(--text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--pink-50); }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .25rem .65rem; border-radius: 20px; font-size: .75rem; font-weight: 700;
}
.badge-green { background: #dcfce7; color: #166534; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-pink { background: var(--pink-100); color: var(--pink-700); }
.badge-gray { background: #f3f4f6; color: #374151; }

/* ============================================================
   SEARCH & FILTER
   ============================================================ */
.search-bar {
  display: flex; align-items: center; gap: .5rem;
  background: var(--bg); border: 2px solid var(--border);
  border-radius: 10px; padding: .5rem 1rem;
  transition: var(--transition);
}
.search-bar:focus-within { border-color: var(--primary); background: var(--surface); }
.search-bar input {
  flex: 1; border: none; background: transparent; outline: none; color: var(--text);
  font-size: .9rem;
}
.search-bar span { color: var(--text-3); font-size: 1.1rem; }
.filter-bar { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }

/* ============================================================
   KASIR
   ============================================================ */
.kasir-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1rem; height: calc(100vh - var(--topbar-h) - 2.5rem); }
.kasir-menu-panel { overflow-y: auto; }
.kasir-cart-panel { display: flex; flex-direction: column; height: 100%; }
.kasir-cart-inner { flex: 1; overflow-y: auto; }
.kasir-cart-footer { padding-top: 1rem; }

.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .75rem; padding: .25rem; }
.menu-card {
  background: var(--surface); border-radius: 12px; overflow: hidden;
  border: 2px solid var(--border); cursor: pointer; transition: var(--transition);
  display: flex; flex-direction: column;
}
.menu-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.menu-card.out-of-stock { opacity: .5; pointer-events: none; }
.menu-card-img {
  width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--pink-100);
  display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
}
.menu-card-body { padding: .6rem; flex: 1; }
.menu-card-name { font-weight: 700; font-size: .85rem; line-height: 1.3; }
.menu-card-price { color: var(--primary); font-weight: 800; font-size: .9rem; margin-top: .3rem; }
.menu-card-stok { font-size: .7rem; color: var(--text-3); }

.kat-tabs { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; scrollbar-width: none; }
.kat-tabs::-webkit-scrollbar { display: none; }
.kat-tab {
  padding: .45rem 1rem; border-radius: 20px; font-size: .85rem; font-weight: 600;
  white-space: nowrap; border: 2px solid var(--border); color: var(--text-2);
  background: var(--surface); transition: var(--transition); cursor: pointer;
}
.kat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.cart-item {
  display: flex; align-items: center; gap: .75rem; padding: .75rem;
  border-bottom: 1px solid var(--border);
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-weight: 700; font-size: .875rem; truncate; }
.cart-item-price { font-size: .8rem; color: var(--text-2); }
.qty-control { display: flex; align-items: center; gap: .4rem; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 8px; font-weight: 800; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  background: var(--pink-100); color: var(--primary); transition: var(--transition);
}
.qty-btn:hover { background: var(--primary); color: #fff; }
.qty-num { min-width: 24px; text-align: center; font-weight: 700; font-size: .9rem; }
.cart-delete { color: var(--danger); width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.cart-delete:hover { background: #fee2e2; }

.cart-total-row { display: flex; justify-content: space-between; padding: .4rem 0; font-size: .9rem; }
.cart-total-row.total { font-weight: 800; font-size: 1.1rem; color: var(--primary); border-top: 2px solid var(--border); margin-top: .5rem; padding-top: .75rem; }

.empty-cart { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-3); gap: .75rem; padding: 2rem; text-align: center; }
.empty-cart .icon { font-size: 3.5rem; }

/* ============================================================
   DASHBOARD CHART
   ============================================================ */
.chart-wrap { position: relative; height: 200px; }
.chart-bars { display: flex; align-items: flex-end; gap: .4rem; height: 160px; padding: 0 .5rem; }
.chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .35rem; }
.chart-bar {
  width: 100%; background: var(--pink-300); border-radius: 4px 4px 0 0;
  min-height: 4px; transition: height .5s ease; position: relative;
}
.chart-bar:hover { background: var(--primary); }
.chart-bar-label { font-size: .7rem; color: var(--text-3); text-align: center; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 1rem;
}
.modal-box {
  background: var(--surface); border-radius: 20px;
  width: 100%; max-width: 520px; max-height: 90vh;
  display: flex; flex-direction: column;
  animation: slideUp .25s ease; box-shadow: var(--shadow-lg);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 1.1rem; font-weight: 800; }
.modal-close { color: var(--text-3); font-size: 1.1rem; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--pink-100); color: var(--primary); }
.modal-body { flex: 1; overflow-y: auto; padding: 1.5rem; }
.modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: .75rem; justify-content: flex-end; }

.confirm-box {
  max-width: 380px; text-align: center; padding: 2rem;
  display: flex; flex-direction: column; align-items: center; gap: .75rem;
}
.confirm-icon { font-size: 2.5rem; }
.confirm-box h3 { font-size: 1.2rem; font-weight: 800; }
.confirm-box p { color: var(--text-2); }
.confirm-btns { display: flex; gap: .75rem; margin-top: .5rem; width: 100%; }
.confirm-btns .btn { flex: 1; }

/* ============================================================
   TOAST
   ============================================================ */
.toast-container { position: fixed; top: 80px; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: .5rem; }
.toast {
  background: var(--surface); border-radius: 12px; padding: .85rem 1.25rem;
  box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary);
  display: flex; align-items: center; gap: .75rem; min-width: 250px; max-width: 340px;
  animation: slideInRight .3s ease; font-size: .875rem; font-weight: 600;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast-icon { font-size: 1.25rem; }
.toast-msg { flex: 1; }
.toast-close { color: var(--text-3); font-size: 1rem; }
.toast.hiding { animation: slideOutRight .25s ease forwards; }

/* ============================================================
   PAGINATION
   ============================================================ */
.pagination { display: flex; align-items: center; gap: .4rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
.page-btn {
  min-width: 36px; height: 36px; border-radius: 8px; font-size: .85rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; padding: 0 .5rem;
  border: 2px solid var(--border); color: var(--text-2); transition: var(--transition);
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state { padding: 3rem 1rem; text-align: center; color: var(--text-3); }
.empty-state .icon { font-size: 3.5rem; margin-bottom: 1rem; }
.empty-state h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-2); margin-bottom: .5rem; }
